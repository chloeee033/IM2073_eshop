<!DOCTYPE html>
<html>
<head>
  <title>Yet A e-Bookshop</title>
</head>
<body>
  <h2>Yet Another e-Bookshop</h2>
  <form method="get" action="eshopquery">
    Choose an author:<br /><br />
    <input type="checkbox" name="author" value="Tan Ah Teck" />Ah Teck
    <input type="checkbox" name="author" value="Mohammad Ali" />Ali
    <input type="checkbox" name="author" value="Kumar" />Kumar
    <input type="checkbox" name="author" value="Kevin Jones" />Kevin
    <br /><br />
    Sort by price:
    <input type="radio" name="sort" value="asc" checked />Low to High
    <input type="radio" name="sort" value="desc" />High to Low
    <input type="submit" value="Search" />
  </form>
</body>
</html>
