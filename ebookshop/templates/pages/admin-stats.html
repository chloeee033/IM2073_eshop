<div class="dashboard-shell">
  <div class="container-fluid py-5">
    <header class="dashboard-toolbar animate__animated animate__fadeInDown">
      <a id="stats-home-link" class="btn btn-outline-secondary btn-sm" href="#">Back to Shop</a>
      <div class="toolbar-title">
        <p class="eyebrow">Dashboard</p>
        <h1 class="page-heading">Admin Statistics</h1>
      </div>
      <span class="status-pill">Logged in as Admin</span>
    </header>

    <div id="stats-alert" class="alert alert-danger d-none mt-4" role="alert"></div>

    <div class="row g-4 mt-1">
      <div class="col-lg-6">
        <section class="stats-card">
          <div class="section-header mb-3">
            <div>
              <p class="eyebrow">Customers</p>
              <h2 class="section-title">Top 5 Customers</h2>
            </div>
          </div>
          <div class="table-responsive">
            <table class="table align-middle mb-0">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Total Spent</th>
                </tr>
              </thead>
              <tbody id="customer-stats-body"></tbody>
            </table>
          </div>
        </section>
      </div>

      <div class="col-lg-6">
        <section class="stats-card">
          <div class="section-header mb-3">
            <div>
              <p class="eyebrow">Books</p>
              <h2 class="section-title">Top Selling Books</h2>
            </div>
          </div>
          <div class="table-responsive">
            <table class="table align-middle mb-0">
              <thead>
                <tr>
                  <th>Title</th>
                  <th>Sold</th>
                  <th>Revenue</th>
                </tr>
              </thead>
              <tbody id="book-stats-body"></tbody>
            </table>
          </div>
        </section>
      </div>
    </div>
  </div>
</div>

{{STATS_CUSTOMER_TEMPLATE}}
{{STATS_BOOK_TEMPLATE}}
