<section class="login-shell">
  <div class="login-card animate__animated animate__fadeInDown">
    <div class="login-topbar">
      <a id="login-back-link" class="back-link" href="#">Back to Shop</a>
    </div>
    <p class="eyebrow">Restricted Area</p>
    <h1 class="page-heading">Admin Login</h1>
    <p class="page-subtitle">Sign in to review orders, customer spend, and sales performance.</p>
    <div id="login-error" class="alert alert-danger py-2 small d-none" role="alert"></div>
    <form id="login-form" method="post" class="login-form">
      <div class="mb-3">
        <label class="form-label" for="admin-username">Username</label>
        <input id="admin-username" type="text" name="username" class="form-control" required>
      </div>
      <div class="mb-4">
        <label class="form-label" for="admin-password">Password</label>
        <input id="admin-password" type="password" name="password" class="form-control" required>
      </div>
      <div class="d-grid">
        <button type="submit" class="btn btn-brown btn-lg">Login</button>
      </div>
    </form>
  </div>
</section>
